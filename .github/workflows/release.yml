# Builds a signed APK and publishes it as a GitHub Release, only when a version tag is
# pushed (git tag v1.2.1 && git push origin v1.2.1) or when run by hand
# (Actions > Release > Run workflow, with the version). Ordinary pushes build nothing.
# The tag is the version: v1.2.1 gives versionName 1.2.1 and versionCode 10201.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64   base64 of the release .jks   (base64 -w0 gecko-release.jks)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.2.1"
        type: string
        required: true

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.ver.outputs.release }}
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Work out the version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          name="${raw#v}"
          if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$name"; then
            echo "Version must look like 1.2.1, got '$raw'"; exit 1
          fi
          IFS=. read -r ma mi pa <<< "$name"
          echo "Releasing $name"
          {
            echo "release=true"
            echo "name=$name"
            echo "tag=v$name"
            echo "code=$(( ma * 10000 + mi * 100 + pa ))"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK platform
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -PversionName=${{ needs.version.outputs.name }} -PversionCode=${{ needs.version.outputs.code }} --stacktrace

      - name: Name and checksum
        id: apk
        run: |
          out="Gecko-${{ needs.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Gecko ${{ needs.version.outputs.name }}
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          generate_release_notes: true

# Every push to main that changes the app builds a signed APK and publishes it as a
# GitHub Release. The version has two numbers, MAJOR.MINOR, and is worked out from the
# newest vX.Y tag and the commit messages since it:
#   feat!: ... or a BREAKING CHANGE footer   -> first number up, second back to 0
#   feat, fix, perf, refactor, style,
#   "chore: update GeckoView"                -> second number up
#   docs, ci, test, other chore only         -> no release (except the very first run)
# Run it by hand (Actions > Release > Run workflow) to force a major or minor bump.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64   base64 of the release .jks   (base64 -w0 gecko-release.jks)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [auto, minor, major]
        default: auto

# One release at a time, so two quick pushes never pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The version before the first tag exists; the first release is the next one up.
  BASE_VERSION: "1.1"

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.ver.outputs.release }}
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: ver
        env:
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1 || true)
          if [ -n "$last" ]; then base="${last#v}"; range="$last..HEAD"; else base="$BASE_VERSION"; range="HEAD"; fi

          if git tag --points-at HEAD | grep -q '^v[0-9]'; then
            echo "This commit is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subjects=$(git log --format=%s "$range")
          bodies=$(git log --format=%b "$range")
          bump=none
          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<< "$subjects" || grep -qE '^BREAKING[ -]CHANGE' <<< "$bodies"; then
            bump=major
          elif grep -qE '^(feat|fix|perf|refactor|style)(\([^)]*\))?:|^chore: update GeckoView' <<< "$subjects"; then
            bump=minor
          fi
          # Nothing is released yet: the first run always publishes, whatever the commits say.
          if [ "$bump" = none ] && [ -z "$last" ]; then bump=minor; fi
          if [ -n "${BUMP_INPUT:-}" ] && [ "$BUMP_INPUT" != auto ]; then bump="$BUMP_INPUT"; fi

          IFS=. read -r ma mi _ <<< "$base"
          case "$bump" in
            major) ma=$(( ma + 1 )); mi=0 ;;
            minor) mi=$(( mi + 1 )) ;;
            *)
              echo "Nothing to release since ${last:-the start}."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          name="$ma.$mi"
          echo "Releasing $name (was $base, $bump bump)"
          {
            echo "release=true"
            echo "name=$name"
            echo "tag=v$name"
            echo "code=$(( ma * 10000 + mi ))"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK platform
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -PversionName=${{ needs.version.outputs.name }} -PversionCode=${{ needs.version.outputs.code }} --stacktrace

      - name: Name and checksum
        id: apk
        run: |
          out="Gecko-${{ needs.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Gecko ${{ needs.version.outputs.name }}
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          generate_release_notes: true

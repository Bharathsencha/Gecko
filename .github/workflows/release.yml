# Push a tag like v1.2.3 to build a signed APK and publish it as a GitHub Release.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64   base64 of the release .jks   (base64 -w0 gecko-release.jks)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: ver
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r ma mi pa <<< "$name"
          code=$(( ${ma:-0} * 10000 + ${mi:-0} * 100 + ${pa:-0} ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }} --stacktrace

      - name: Name and checksum
        id: apk
        run: |
          out="Gecko-${{ steps.ver.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          generate_release_notes: true
